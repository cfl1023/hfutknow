name: update

# 自续跑：每轮跑完后自己触发下一轮，绕开 GitHub 对 schedule 的限流
# （schedule 实测 25-35 分钟才来一次，workflow_dispatch 链式触发不受此限）
on:
  schedule:
    - cron: "0 */6 * * *" # 兜底：每 6 小时一次，链断了也能自己爬起来
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write # 用于链式自我触发

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install lxml

      - name: Crawl sources (fast)
        run: python -m pipeline.sync --limit 14 --fast

      - name: Build RSS
        run: python tools/make_rss.py

      - name: Clean junk items
        run: python tools/clean_junk.py

      - name: Track competitions (deadlines)
        run: python tools/build_tracking.py

      - name: Commit data
        run: |
          git config user.name "hfutknow-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main -q || true
            git reset --soft origin/main
            git add site/data
            if git diff --cached --quiet; then
              echo "no new items"; exit 0
            fi
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push retry $i"; sleep 5
          done
          echo "push failed, will retry next round"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  chain:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait, then trigger the next round
        if: vars.CHAIN_ENABLED != 'false'
        run: |
          # 6 分钟一轮 ≈ 10 次/小时，压在 GitHub Pages 的部署上限内
          sleep 300
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}'
