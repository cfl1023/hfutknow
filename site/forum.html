<style>
  .forum-hero { padding: 30px 0 6px; }
  .forum-hero h1 { font-size: clamp(24px, 3.4vw, 34px); letter-spacing: -.01em; margin: 0 0 10px; font-weight: 650; }
  .forum-hero h1 .hl { color: var(--accent); }
  .forum-hero p { margin: 0 0 14px; color: var(--text-2); font-size: 14.5px; max-width: 44em; }
  .tabrow { display: flex; gap: 8px; margin: 18px 0 4px; }
  .tabrow button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 15px; font: inherit; font-size: 13px; color: var(--text-2); cursor: pointer; }
  .tabrow button.active { background: var(--text); color: var(--bg); border-color: transparent; font-weight: 600; }
  .tabrow button .n { font-size: 11px; opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .q-bar { display: flex; gap: 8px; align-items: center; margin: 12px 0 2px; }
  .q-bar input { flex: 1; max-width: 420px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 12px; font: inherit; font-size: 13.5px; color: var(--text); outline: 0; }
  .q-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pick { margin: 26px 0 8px; padding: 16px 18px 6px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .pick h2 { font-size: 14px; margin: 0 0 4px; letter-spacing: .01em; }
  .pick .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .pick ol { margin: 0 0 12px; padding-left: 20px; }
  .pick li { margin-bottom: 7px; font-size: 13.5px; line-height: 1.45; }
  .pick li a { color: var(--text); border-bottom: 1px solid color-mix(in srgb, var(--accent) 26%, transparent); }
  .pick li a:hover { color: var(--accent-2); }
  .pick li .m { color: var(--muted); font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .card .sum { -webkit-line-clamp: 2; }
  .card .meta2 { font-size: 12px; color: var(--muted); margin: 2px 0 0; font-variant-numeric: tabular-nums; }
  .badge-hit { background: var(--ok-soft); color: var(--ok); }
  .badge-src { font-size: 10.5px; letter-spacing: .06em; padding: 2px 7px; border-radius: 5px; background: var(--chip-bg, rgba(0,0,0,.05)); color: var(--text-2); border: 1px solid var(--line); }
  .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  @media (max-width: 900px) { .grid { columns: 2; } }
  @media (max-width: 620px) { .grid { columns: 1; } .mainnav { display: none; } }
