<style>
  .forum-hero { padding: 30px 0 6px; }
  .forum-hero h1 { font-size: clamp(24px, 3.4vw, 34px); letter-spacing: -.01em; margin: 0 0 10px; font-weight: 650; }
  .forum-hero h1 .hl { color: var(--accent); }
  .forum-hero p { margin: 0 0 14px; color: var(--text-2); font-size: 14.5px; max-width: 44em; }
  .tabrow { display: flex; gap: 8px; margin: 18px 0 4px; }
  .tabrow button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 15px; font: inherit; font-size: 13px; color: var(--text-2); cursor: pointer; }
  .tabrow button.active { background: var(--text); color: var(--bg); border-color: transparent; font-weight: 600; }
  .tabrow button .n { font-size: 11px; opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .q-bar { display: flex; gap: 8px; align-items: center; margin: 12px 0 2px; }
  .q-bar input { flex: 1; max-width: 420px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 12px; font: inherit; font-size: 13.5px; color: var(--text); outline: 0; }
  .q-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pick { margin: 26px 0 8px; padding: 16px 18px 6px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .pick h2 { font-size: 14px; margin: 0 0 4px; letter-spacing: .01em; }
  .pick .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .pick ol { margin: 0 0 12px; padding-left: 20px; }
  .pick li { margin-bottom: 7px; font-size: 13.5px; line-height: 1.45; }
  .pick li a { color: var(--text); border-bottom: 1px solid color-mix(in srgb, var(--accent) 26%, transparent); }
  .pick li a:hover { color: var(--accent-2); }
  .pick li .m { color: var(--muted); font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .card .sum { -webkit-line-clamp: 2; }
  .card .meta2 { font-size: 12px; color: var(--muted); margin: 2px 0 0; font-variant-numeric: tabular-nums; }
  .badge-hit { background: var(--ok-soft); color: var(--ok); }
  .badge-src { font-size: 10.5px; letter-spacing: .06em; padding: 2px 7px; border-radius: 5px; background: var(--chip-bg, rgba(0,0,0,.05)); color: var(--text-2); border: 1px solid var(--line); }
  .badge-read { background: var(--ok-soft, rgba(60,140,90,.12)); color: var(--muted); }
  .card-wrap { break-inside: avoid; -webkit-column-break-inside: avoid; }
  .card-wrap.is-read .card { opacity: .55; }
  /* 按钮放在卡片外面单独一行：不叠在链接上，就不会点开帖子时误触 */
  .card-act { display: flex; justify-content: flex-end; padding: 0 4px 12px; margin-top: -6px; }
  .mk-read { border: 1px solid var(--line); background: var(--bg); color: var(--text-2); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 11.5px; cursor: pointer; opacity: .35; transition: opacity .15s, background .15s, color .15s, border-color .15s; }
  .card-wrap:hover .mk-read, .mk-read:focus-visible, .mk-read.on, .mk-read.armed { opacity: 1; }
  .mk-read:hover { background: var(--text); color: var(--bg); border-color: transparent; }
  .mk-read.on { color: var(--accent); border-color: var(--accent); background: var(--bg); }
  .mk-read.armed { color: #b4501f; border-color: #b4501f; background: rgba(180,80,31,.08); opacity: 1; }
  .mk-read.mini { opacity: 1; margin-left: 8px; padding: 2px 8px; font-size: 11px; vertical-align: 1px; }
  @media (hover: none) { .mk-read { opacity: 1; } }
  /* 手机上：按钮放到拇指能够着的位置，字号也放大 */
  .app-open { display: none; }
  .card-act { display: flex; gap: 8px; align-items: center; padding: 4px 2px 12px; }
  /* 左滑露出的动作区 */
  .swipe { position: relative; overflow: hidden; border-radius: var(--radius, 14px); }
  .swipe .card { position: relative; z-index: 2; background: var(--surface); transition: transform .18s ease; touch-action: pan-y; }
  .swipe.open .card { transform: translateX(-232px); }
  .swipe.open .swipe-acts button { opacity: 1; }
  .swipe-acts { position: absolute; inset: 0 0 0 auto; display: flex; z-index: 1; }
  .swipe-acts button { width: 58px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: inherit; font-size: 11px; color: var(--text-2); cursor: pointer; }
  .swipe-acts button:active { background: rgba(0,0,0,.04); }
  .swipe-acts b { font-size: 19px; font-weight: 400; line-height: 1; }
  .swipe-acts button.on { color: var(--accent); }
  .act-like.on b { filter: none; }
  .act-dislike.on b { filter: grayscale(1); opacity: .9; }
  .act-star.on b { color: #d0a021; }
  .badge-star { background: rgba(208,160,33,.16); color: #8a6a12; }
  .swipe-hint { font-size: 10.5px; color: var(--muted); opacity: .55; margin-right: auto; }
  .app-open { border: 1px solid var(--line); color: var(--text-2); background: var(--bg); border-radius: 999px; padding: 4px 11px; font-size: 11.5px; text-decoration: none; }
  .app-open:active { background: var(--text); color: var(--bg); border-color: transparent; }
  @media (hover: none) { .app-open { display: inline-flex; } }
  @media (max-width: 620px) {
  .mk-read, .mk-read.mini { padding: 10px 15px; font-size: 13px; min-height: 40px; }
  .app-open { padding: 10px 13px; min-height: 40px; display: inline-flex; align-items: center; }
  .toolbar .chip { padding: 8px 12px; min-height: 38px; }
  .swipe-acts button { width: 62px; }
  .swipe.open .card, .swipe .card { will-change: transform; }
    .forum-hero { padding: 14px 0 2px; }
    .forum-hero h1 { font-size: 21px; line-height: 1.35; }
    .forum-hero p { font-size: 13px; margin-bottom: 10px; }
    .forum-hero .stats { gap: 18px; }
    .toolbar { position: sticky; top: 0; z-index: 25; background: var(--bg); padding: 8px 0; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
    .mk-read, .app-open { padding: 8px 14px; font-size: 12.5px; }
    .card-act { padding: 0 2px 14px; }
    .ck-toast { bottom: 82px; left: 12px; right: 12px; transform: translateY(14px); max-width: none; }
    .ck-toast.show { transform: none; }
    .dr-panel { width: 100%; }
    .search { display: none; }
  }
  .pick li.read-now { opacity: .45; text-decoration: line-through; }
  .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  @media (max-width: 900px) { .grid { columns: 2; } }
  @media (max-width: 620px) { .grid { columns: 1; } .mainnav { display: none; } }
  /* 提示条：标完能直接点「放回来」撤销 */
  .ck-toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px); display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: 13px; box-shadow: 0 8px 26px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 60; max-width: min(560px, 92vw); }
  .ck-toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .ck-toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ck-toast button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 7px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer; flex: none; }
  /* 「看过的」抽屉 */
  .ck-drawer { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.32); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .ck-drawer.open { opacity: 1; pointer-events: auto; }
  .dr-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(430px, 92vw); background: var(--bg); border-left: 1px solid var(--line); box-shadow: -12px 0 34px rgba(0,0,0,.14); overflow: auto; padding: 16px 18px 40px; transform: translateX(24px); transition: transform .2s; }
  .ck-drawer.open .dr-panel { transform: none; }
  .dr-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .dr-head b { font-size: 15px; }
  .dr-x { border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }
  .dr-hint, .dr-empty { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
  .dr-list { list-style: none; margin: 0; padding: 0; }
  .dr-list li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .dr-body { flex: 1; min-width: 0; }
  .dr-body a { color: var(--text); text-decoration: none; font-size: 13px; line-height: 1.45; display: block; }
  .dr-body a:hover { color: var(--accent); }
  .dr-meta { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .dr-back { flex: none; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 11.5px; cursor: pointer; }
  .dr-back:hover { background: var(--accent); color: #fff; }
  .dr-foot { margin-top: 16px; }
  .dr-all { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 9px; padding: 9px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .dr-all:hover { border-color: var(--accent); color: var(--accent); }
</style>
